name: Test invalid release-channel is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Input validation throws "release-channel has unexpected value" before any
      # network call, so the step must fail regardless of the repository.
      - id: action
        uses: .
        continue-on-error: true
        with:
          release-channel: nightly
      - name: Assert action failed on invalid input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid release-channel, got '$OUTCOME'"
            exit 1
          fi
          if git branch --list 'gradlew-update-*' | grep -q .; then
            echo "FAIL: unexpected gradlew-update branch created"
            exit 1
          fi
          echo "PASS"
