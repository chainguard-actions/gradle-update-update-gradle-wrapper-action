name: Test invalid release-channel
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clear any pre-existing extraheader config
        run: |
          git config --unset-all "http.https://github.com/.extraheader" || true
      - id: action
        uses: .
        continue-on-error: true
        with:
          release-channel: nightly-bogus
      - name: Assert action failed on invalid input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid release-channel"
            exit 1
          fi
          echo "PASS"
      - name: Assert git auth was not configured (input validation happens first)
        run: |
          VALUE="$(git config --get-regexp 'http\..*\.extraheader' || true)"
          if [ -n "$VALUE" ]; then
            echo "FAIL: extraheader should not be set when inputs are invalid"
            exit 1
          fi
          echo "PASS"
      - name: Cleanup auth header
        if: always()
        run: |
          git config --unset-all "http.https://github.com/.extraheader" || true
