name: Test release-candidate channel with custom inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          release-channel: Release-Candidate
          labels: |
            dependencies
            gradle
          reviewers: someone, someone-else
          paths: 'gradle/**'
          paths-ignore: 'node_modules/**'
          set-distribution-checksum: 'false'
          merge-method: SQUASH
          pr-title-template: 'Bump Gradle %sourceVersion% -> %targetVersion%'
          commit-message-template: 'chore: gradle %targetVersion%'
      - name: Assert action ran (succeeded, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
