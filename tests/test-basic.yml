name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Record starting branch
        id: before
        run: echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action ran (succeeded, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BEFORE: ${{ steps.before.outputs.branch }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
            # The action fails at the repo-scoped ref lookup, before any branch is created
            AFTER="$(git rev-parse --abbrev-ref HEAD)"
            echo "branch before: $BEFORE, after: $AFTER"
            if [ "$AFTER" != "$BEFORE" ]; then
              echo "FAIL: action switched branch despite failing"
              exit 1
            fi
            if git branch --list 'gradlew-update-*' | grep -q .; then
              echo "FAIL: an update branch was created despite failing"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
