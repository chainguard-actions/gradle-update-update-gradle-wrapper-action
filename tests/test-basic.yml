name: Test basic usage (default inputs)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Record HEAD before running the action
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # The action's first repo-scoped call (git.listMatchingRefs on GITHUB_REPOSITORY)
      # 404s on the harness sentinel repo, so failure is an accepted outcome.
      # This repository contains no Gradle Wrapper files, so on success the action
      # must stop with a warning without creating branches or commits.
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert outcome and that no update branch/commit was created
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BEFORE: ${{ steps.before.outputs.sha }}
        run: |
          echo "outcome: $OUTCOME"
          AFTER="$(git rev-parse HEAD)"
          echo "HEAD before: $BEFORE, after: $AFTER"
          git branch --list
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (no wrapper files found)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          if git branch --list 'gradlew-update-*' | grep -q .; then
            echo "FAIL: unexpected gradlew-update branch created"
            exit 1
          fi
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "FAIL: HEAD moved unexpectedly"
            exit 1
          fi
          echo "PASS: repository left untouched"
